<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Repositório de Apps — PCP Corporativo · Alpargatas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#FFFFFF; --bg-soft:#FAFBFC; --line:#E7E9EB;
  --ink:#2E2E2E; --ink-soft:#77787B; --ink-faint:#ABADB0;

  --c1:#0072B4; /* blue */
  --c2:#00AEEA; /* cyan */
  --c3:#00A551; /* green */
  --c4:#ACC32B; /* olive */
  --c5:#FCB813; /* yellow */
  --c6:#F4A321; /* amber */
  --c7:#EA5F00; /* orange */
  --c8:#EC1C24; /* red */
  --neutral1:#9AA0A6;
  --neutral2:#6B7280;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
  padding-bottom:70px; position:relative;
}
.bg-geo{
  position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
  background:
    radial-gradient(720px 580px at 6% -4%, rgba(0,114,180,0.29), transparent 62%),
    radial-gradient(630px 520px at 40% -6%, rgba(0,174,234,0.24), transparent 60%),
    radial-gradient(760px 630px at 82% 4%, rgba(0,165,81,0.22), transparent 62%),
    radial-gradient(630px 540px at -4% 52%, rgba(172,195,43,0.20), transparent 60%),
    radial-gradient(700px 580px at 100% 46%, rgba(244,163,33,0.24), transparent 62%),
    radial-gradient(630px 520px at 30% 104%, rgba(234,95,0,0.19), transparent 60%),
    radial-gradient(700px 580px at 92% 100%, rgba(236,28,36,0.18), transparent 62%),
    linear-gradient(180deg, #EEF4FA 0%, #FFFFFF 54%);
}
.mono{ font-family:'IBM Plex Mono',monospace; }
.wrap{ max-width:1360px; margin:0 auto; padding:0 28px; position:relative; }

/* ============ RAINBOW TOP BAR ============ */
.rainbow-bar{ height:7px; width:100%; background: linear-gradient(90deg,
  var(--c1) 0%, var(--c2) 14.3%, var(--c3) 28.6%, var(--c4) 42.9%,
  var(--c5) 57.1%, var(--c6) 71.4%, var(--c7) 85.7%, var(--c8) 100%); }

/* ============ HERO / HEADER ============ */
header{ position:relative; padding:52px 0 40px 0; overflow:hidden; border-bottom:1px solid var(--line); }
.grain-texture{
  position:absolute; inset:0; opacity:0.5; pointer-events:none;
  background-image: radial-gradient(ellipse 3px 6px at center, rgba(0,114,180,0.10) 45%, transparent 46%);
  background-size: 26px 26px;
  mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 85%);
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 85%);
}
.brandbox{ position:absolute; top:6px; right:28px; display:flex; flex-direction:column; align-items:flex-end; gap:8px; z-index:2;}
.brandbox img{ height:118px; width:auto; }
.brandmark{ display:flex; align-items:center; gap:6px; color:var(--ink-faint); font-family:'Archivo',sans-serif; font-weight:700; font-size:12px; letter-spacing:1.5px; }
.tri-logo{ width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:9px solid var(--ink-faint); }
@media(max-width:760px){ .brandbox{ position:static; align-items:flex-start; margin-bottom:20px; } .brandbox img{ height:80px; } }

.eyebrow{ position:relative; z-index:2; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:3px; color:var(--c1); text-transform:uppercase; display:flex; align-items:center; gap:8px; }
.eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--c3); }
h1{ position:relative; z-index:2; font-family:'Archivo',sans-serif; font-weight:900; font-size:44px; letter-spacing:-1px; margin-top:12px; color:var(--ink); max-width:620px; line-height:1.05;}
h1 .rb{
  background: linear-gradient(90deg, var(--c1), var(--c3) 35%, var(--c6) 65%, var(--c8));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.subtitle{ position:relative; z-index:2; color:var(--ink-soft); font-size:15px; margin-top:12px; max-width:600px; line-height:1.65; }

.hero-stats{ position:relative; z-index:2; display:flex; gap:28px; margin-top:30px; flex-wrap:wrap; align-items:center; }
.hstat{ display:flex; align-items:baseline; gap:8px; }
.hstat .n{ font-family:'Archivo',sans-serif; font-weight:800; font-size:26px; color:var(--ink); }
.hstat .l{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px; }

.improve-badge{ display:flex; align-items:center; gap:10px; padding-left:24px; border-left:1px solid var(--line); }
.improve-badge .pdca-spin{ animation: pdcaspin 6s linear infinite; flex-shrink:0; }
@keyframes pdcaspin{ to{ transform:rotate(360deg); } }
.improve-badge .txt{ display:flex; flex-direction:column; line-height:1.3; }
.improve-badge .txt b{ font-family:'Archivo',sans-serif; font-weight:800; font-size:12px; color:var(--ink); }
.improve-badge .txt span{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--ink-soft); letter-spacing:.3px; }
@media(max-width:620px){ .improve-badge{ padding-left:0; border-left:none; margin-top:6px; } }

/* ============ FILTER CHIPS ============ */
section{ padding-top:46px; }
.sec-title{ font-family:'Archivo',sans-serif; font-size:19px; font-weight:800; color:var(--ink); margin-bottom:4px;}
.sec-desc{ color:var(--ink-soft); font-size:13.5px; margin-bottom:22px; max-width:660px; line-height:1.6;}

.filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px; }
.chip{
  font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.3px;
  padding:7px 14px; border-radius:20px; border:1px solid var(--line); background:#fff; color:var(--ink-soft);
  cursor:pointer; transition:all .15s ease; white-space:nowrap;
}
.chip:hover{ border-color:var(--ink-faint); color:var(--ink); }
.chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
.chip .cnt{ opacity:.6; margin-left:4px; }

/* ============ APP GRID ============ */
.app-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:16px; }
@media(max-width:1180px){ .app-grid{grid-template-columns:repeat(4,1fr);} }
@media(max-width:940px){ .app-grid{grid-template-columns:repeat(3,1fr);} }
@media(max-width:700px){ .app-grid{grid-template-columns:repeat(2,1fr);} }
@media(max-width:460px){ .app-grid{grid-template-columns:1fr;} }

.cat-heading{
  grid-column:1/-1; display:flex; align-items:center; gap:9px;
  font-family:'Archivo',sans-serif; font-weight:800; font-size:13px; letter-spacing:.3px;
  color:var(--ink); text-transform:uppercase; padding-bottom:9px; margin:30px 0 2px;
  border-bottom:1px solid var(--line);
}
.cat-heading:first-child{ margin-top:0; }
.cat-heading .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 3px rgba(0,0,0,0.05); }
.cat-heading .cnt{ margin-left:auto; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px; letter-spacing:0; text-transform:none; color:var(--ink-soft); }

.app-card{
  display:block; text-decoration:none; color:inherit; text-align:left; width:100%;
  background:#fff; border:1px solid var(--line); border-radius:16px; padding:17px;
  border-top:4px solid var(--accent-top, var(--line));
  position:relative; overflow:hidden;
  box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 10px 24px -10px rgba(15,23,42,0.18);
  transition: transform .25s cubic-bezier(.2,.8,.3,1), box-shadow .25s ease, border-color .25s ease;
  font-family:inherit; cursor:default;
}
.app-card.clickable{ cursor:pointer; }
.app-card.clickable:hover{ transform: translateY(-6px) rotate(-0.3deg); box-shadow: 0 4px 10px rgba(15,23,42,0.08), 0 24px 44px -12px rgba(15,23,42,0.28); border-color:transparent; border-top-color:var(--accent-top, var(--line)); }
.app-card.planned{ cursor:not-allowed; }
.app-card.planned .app-name, .app-card.planned .app-desc{ opacity:.75; }

.app-icon{
  width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  margin-bottom:10px; color:#fff; flex-shrink:0;
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), 0 6px 14px -6px rgba(15,23,42,0.35);
}
.app-icon svg{ width:20px; height:20px; }
.app-card.planned .app-icon{ filter:grayscale(85%) opacity(0.55); }

.app-cat{ font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; margin-bottom:4px; display:block; }

.app-status{ position:absolute; top:14px; right:14px; font-family:'IBM Plex Mono',monospace; font-size:8px; font-weight:700; padding:3px 7px; border-radius:20px; letter-spacing:.3px; white-space:nowrap; }
.app-status.live{ background:rgba(0,165,81,0.12); color:var(--c3); }
.app-status.dev{ background:rgba(0,114,180,0.12); color:var(--c1); }
.app-status.soon{ background:#EFF0F1; color:var(--ink-soft); }

.app-name{ font-family:'Archivo',sans-serif; font-weight:800; font-size:14px; color:var(--ink); line-height:1.28; padding-right:0;}
.app-desc{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; line-height:1.55; min-height:52px;}
.app-cta{ display:flex; align-items:center; gap:6px; margin-top:10px; font-family:'Archivo',sans-serif; font-weight:700; font-size:11px; }
.app-cta .arrow{ transition: transform .2s ease; }
.app-card.clickable:hover .app-cta .arrow{ transform: translateX(4px); }
.app-hybrid-tag{ display:inline-flex; align-items:center; gap:5px; margin-top:14px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); }
.app-hybrid-tag svg{ width:12px; height:12px; transition:transform .2s ease; }
.app-card.hybrid-open .app-hybrid-tag svg{ transform:rotate(180deg); }

/* hybrid sub-módulos panel */
.hybrid-panel{ grid-column:1 / -1; display:none; margin-top:-8px; }
.hybrid-panel.open{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; padding:18px; background:var(--bg-soft); border:1px dashed var(--line); border-radius:16px; }
.hybrid-item{ display:flex; align-items:center; gap:8px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:12px; font-size:12.5px; font-weight:600; color:var(--ink); text-decoration:none; }
.hybrid-item .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.hybrid-item .dot.live{ background:var(--c3); }
.hybrid-item .dot.dev{ background:var(--c1); }
.hybrid-item .dot.soon{ background:var(--ink-faint); }
.hybrid-item.disabled{ color:var(--ink-soft); cursor:default; }

/* ghost "add new theme" card */
.app-card.ghost{ border-style:dashed; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; min-height:140px; color:var(--ink-faint); }
.app-card.ghost .plus{ width:34px; height:34px; border-radius:11px; border:1.5px dashed var(--ink-faint); display:flex; align-items:center; justify-content:center; margin-bottom:10px; font-size:18px; font-weight:300; }
.app-card.ghost b{ font-family:'Archivo',sans-serif; font-size:13px; color:var(--ink-soft); }
.app-card.ghost span{ font-size:11px; margin-top:5px; line-height:1.5; max-width:200px; }

/* ============ FOOTER ============ */
footer{ margin-top:64px; padding-top:24px; border-top:1px solid var(--line); text-align:center; color:var(--ink-faint); font-size:11px; }
footer .mono{ color:var(--c1); }
</style>
</head>

    icon:'calrange', url:'' },

  { id:'mp-bloqueada-cq', title:'Gestão MP Bloqueada CQ', cat:'qualidade', status:'soon',
    desc:'Materiais bloqueados por controle de qualidade — status, tempo de bloqueio e ação de liberação.',
    icon:'lock', url:'' },

  { id:'giro-estoque',    title:'Giro de Estoque', cat:'estoque', status:'soon',
    desc:'Indicador de giro/cobertura de matéria-prima por planta, categoria e analista responsável.',
    icon:'refresh', url:'' },

  { id:'cronograma',      title:'Cronograma do Projeto', cat:'projeto', status:'soon',
    desc:'Backlog Agile da estruturação da área — fases, ações, responsáveis e KPIs de execução.',
    icon:'kanban', url:'' },

  /* Exemplo de box HÍBRIDO (não ativo — apenas referência para o futuro
     tema "Pessoas", que deverá reunir vários sub-apps num único card):
  { id:'pessoas', title:'Pessoas', cat:'projeto', status:'dev', icon:'database',
    desc:'Central dos temas de gente da área.',
    children:[
      { title:'PDI', status:'soon', url:'' },
      { title:'Avaliação de Desempenho', status:'soon', url:'' },
      { title:'Férias', status:'soon', url:'' },
    ] },
  */
];

/* ====================================================================== */

function iconSvg(key){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[key]||''}</svg>`;
}

function renderFilters(active){
  const counts = { all: APPS.length };
  APPS.forEach(a=>{ counts[a.cat] = (counts[a.cat]||0)+1; });
  const chips = [`<button class="chip ${active==='all'?'active':''}" data-cat="all">Todos <span class="cnt">${counts.all}</span></button>`];
  Object.keys(CATEGORIES).forEach(key=>{
    if(!counts[key]) return;
    chips.push(`<button class="chip ${active===key?'active':''}" data-cat="${key}">${CATEGORIES[key].label} <span class="cnt">${counts[key]}</span></button>`);
  });
  document.getElementById('filterRow').innerHTML = chips.join('');
  document.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=> renderGrid(btn.dataset.cat));
  });
}

function renderGrid(filter){
  filter = filter || 'all';
  renderFilters(filter);
  const grid = document.getElementById('appGrid');
  grid.innerHTML = '';

  // organiza sempre por tema (categoria) — quando um filtro específico está
  // ativo, mostra só aquele grupo; em "Todos", agrupa todas as categorias
  // na ordem definida em CATEGORIES, com um cabeçalho por tema.
  const groups = filter === 'all' ? Object.keys(CATEGORIES) : [filter];

  groups.forEach(catKey=>{
    const apps = APPS.filter(a=> a.cat===catKey);
    if(!apps.length) return;
    const cat = CATEGORIES[catKey];

    if(filter==='all'){
      const heading = document.createElement('div');
      heading.className = 'cat-heading';
      heading.innerHTML = `<span class="dot" style="background:${cat.g1}"></span>${cat.label}`;
      grid.appendChild(heading);
    }

    apps.forEach(app=>{
      const isHybrid = Array.isArray(app.children) && app.children.length>0;
      const clickable = app.status==='live' || isHybrid;
      const tag = isHybrid ? 'div' : (clickable ? 'a' : 'div');

      const card = document.createElement(tag);
      card.className = `app-card ${clickable?'clickable':''} ${app.status==='soon'?'planned':''} ${isHybrid?'hybrid':''}`;
      if(tag==='a'){ card.href = app.url || '#'; card.target = '_blank'; card.rel = 'noopener'; }
      card.style.setProperty('--accent-top', cat.g1);

      card.innerHTML = `
        <div class="app-status ${STATUS_CLASS[app.status]}">${STATUS_LABEL[app.status]}</div>
        <div class="app-icon" style="background:linear-gradient(135deg, ${cat.g1}, ${cat.g2})">${iconSvg(app.icon)}</div>
        <span class="app-cat" style="color:${cat.g1}">${cat.label}</span>
        <div class="app-name">${app.title}</div>
        ${isHybrid
          ? `<div class="app-hybrid-tag">${app.children.length} sub-módulos <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>`
          : `<div class="app-cta">${STATUS_CTA[app.status]}${clickable?' <span class=\"arrow\">→</span>':''}</div>`}
      `;

      grid.appendChild(card);

      if(isHybrid){
        const panel = document.createElement('div');
        panel.className = 'hybrid-panel';
        panel.innerHTML = app.children.map(c=>{
          const dot = STATUS_CLASS[c.status]||'soon';
          return c.status==='live'
            ? `<a class="hybrid-item" href="${c.url||'#'}" target="_blank" rel="noopener"><span class="dot ${dot}"></span>${c.title}</a>`
            : `<div class="hybrid-item disabled"><span class="dot ${dot}"></span>${c.title}</div>`;
        }).join('');
        grid.appendChild(panel);

        card.addEventListener('click', ()=>{
          card.classList.toggle('hybrid-open');
          panel.classList.toggle('open');
        });
      }
    });
  });

  // ghost card — sempre visível, lembra como o repositório cresce
  const ghost = document.createElement('div');
  ghost.className = 'app-card ghost';
  ghost.innerHTML = `<div class="plus">+</div><b>Novo tema em breve</b><span>Cada novo controle vira um card aqui — basta publicar o app e adicioná-lo ao array APPS no topo do arquivo.</span>`;
  grid.appendChild(ghost);
}

function renderStats(){
  document.getElementById('st-live').textContent = APPS.filter(a=>a.status==='live').length;
  document.getElementById('st-dev').textContent  = APPS.filter(a=>a.status==='dev').length;
  document.getElementById('st-soon').textContent = APPS.filter(a=>a.status==='soon').length;
  const live = APPS.filter(a=>a.status==='live').length;
  document.getElementById('footerText').innerHTML =
    `Repositório de Apps — PCP Corporativo · <span class="mono">${live} app${live===1?'':'s'} ativo${live===1?'':'s'}</span> · atualizado conforme novas ferramentas forem publicadas`;
}

renderStats();
renderGrid('all');
</script>
